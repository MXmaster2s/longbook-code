<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shared report</title>

<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
  /* Built on tokens.css: colours, radii, gaps and type roles are the app's own. */
  * { box-sizing: border-box; margin: 0; padding: 0 }
  [hidden] { display: none !important }
  :root { color-scheme: light }
  :root[data-appearance="dark"] { color-scheme: dark }
  html, body { background: var(--lb-canvas) }
  body {
    color: var(--lb-text-primary); font-family: var(--lb-font-sans);
    font-size: var(--lb-type-body-size); letter-spacing: var(--lb-type-body-tracking);
    line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 720px; margin: 0 auto; padding: var(--lb-space-s12) var(--lb-space-s4) }
  a { color: var(--lb-brand-text) }
  a:hover { color: var(--lb-brand) }
  .secondary { color: var(--lb-text-secondary) }
  .tertiary { color: var(--lb-text-tertiary) }
  .brand-text { color: var(--lb-brand-text) }
  .num { font-variant-numeric: tabular-nums }
  .glyph { flex: none; display: block }

  .report-head { display: grid; gap: var(--lb-space-s1) }
  .report-head h1, .gate h1 { line-height: 1.15; overflow-wrap: anywhere }
  .module { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--lb-space-s2); margin-top: var(--lb-space-s6) }
  .module-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--lb-space-s2) }
  .module-head h2 { line-height: 1.25; min-width: 0; overflow-wrap: anywhere }
  .module-note { flex: none; white-space: nowrap }
  .panel {
    min-width: 0; padding: var(--lb-space-s4); background: var(--lb-card);
    border: 1px solid var(--lb-hairline); border-radius: var(--lb-radius-lg);
  }

  .stats { display: grid; gap: var(--lb-space-s2) }
  .stat-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--lb-space-s1) var(--lb-space-s2) }
  .stat-figure { line-height: 1.2 }
  .delta-good { color: var(--lb-mint-tint) }
  .delta-bad { color: var(--lb-danger) }

  .donut { display: grid; gap: var(--lb-space-s3) }
  .ring-wrap { position: relative; width: 190px; max-width: 100%; margin: 0 auto }
  .ring { display: block; width: 100%; height: auto }
  .ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; padding: var(--lb-space-s8); text-align: center;
  }
  .ring-title { line-height: 1.2; white-space: nowrap }
  .ring-note { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
  .legend { display: grid }
  .legend-row { display: flex; align-items: center; gap: var(--lb-space-s2); min-height: 30px }
  .swatch { flex: none; width: 8px; height: 8px; border-radius: 2px }
  .swatch-hollow { box-shadow: inset 0 0 0 1px var(--lb-text-quaternary) }
  .legend-name { flex: 1; min-width: 0; overflow: hidden; color: var(--lb-text-secondary); text-overflow: ellipsis; white-space: nowrap }
  .legend-share { color: var(--lb-text-primary); font-variant-numeric: tabular-nums; white-space: nowrap }
  .legend-amount { color: var(--lb-text-tertiary); font-variant-numeric: tabular-nums; white-space: nowrap }

  .tiles { display: flex; gap: var(--lb-space-s2); overflow-x: auto; scrollbar-width: thin; -webkit-overflow-scrolling: touch }
  .tile {
    flex: none; min-width: 124px; display: flex; flex-direction: column; align-items: flex-start;
    gap: var(--lb-space-s2); padding: var(--lb-space-s3); background: var(--lb-sunken);
    border: 1px solid var(--lb-hairline); border-radius: var(--lb-radius-md);
  }
  .tile-glyph { display: grid; place-items: center; width: 30px; height: 30px; background: var(--lb-chrome); border-radius: var(--lb-radius-xs) }
  .tile-dot { width: 10px; height: 10px; border-radius: 50% }
  .tile-name, .tile-amount { white-space: nowrap }
  .tile-amount { color: var(--lb-text-primary) }

  .charge-controls { display: grid; gap: var(--lb-space-s2) }
  .search {
    display: flex; align-items: center; gap: var(--lb-space-s2); padding: var(--lb-space-s2) var(--lb-space-s3);
    color: var(--lb-text-tertiary); background: var(--lb-card); border: 1px solid var(--lb-hairline);
    border-radius: var(--lb-radius-sm);
  }
  .search:focus-within { border-color: var(--lb-brand) }
  .search-input { flex: 1; min-width: 0; color: var(--lb-text-primary); background: none; border: 0; outline: 0; font: inherit; font-size: 16px }
  .search-input::placeholder { color: var(--lb-text-tertiary) }
  .chips { display: flex; gap: var(--lb-space-s2); overflow-x: auto; scrollbar-width: none }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: var(--lb-space-s1);
    padding: var(--lb-space-s2) var(--lb-space-s3); color: var(--lb-text-secondary); background: var(--lb-chrome);
    border: 0; border-radius: 999px; font-family: inherit; cursor: pointer;
  }
  .chip.picked { color: var(--lb-on-brand); background: var(--lb-brand) }
  .chip:focus-within, .chip:focus-visible { outline: 2px solid var(--lb-brand); outline-offset: 2px }
  .chip-select { appearance: none; -webkit-appearance: none; padding: 0; color: inherit; background: none; border: 0; outline: 0; font: inherit; cursor: pointer }
  .chip-select option { color: var(--lb-text-primary); background: var(--lb-card) }
  .charges { display: grid; gap: var(--lb-space-s2) }
  .charge {
    display: flex; align-items: center; gap: var(--lb-space-s3); min-width: 0;
    padding: var(--lb-space-s4); background: var(--lb-card); border-radius: var(--lb-radius-md);
  }
  .charge.removed { opacity: .6 }
  .rail { flex: none; align-self: stretch; width: 3px; border-radius: 2px }
  .charge-body { flex: 1; min-width: 0; display: grid; gap: 2px }
  .charge-name { overflow: hidden; color: var(--lb-text-primary); text-overflow: ellipsis; white-space: nowrap }
  .facts { display: flex; flex-wrap: wrap; gap: 2px var(--lb-space-s2); color: var(--lb-text-tertiary) }
  .fact { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap }
  .charge-amount { flex: none; color: var(--lb-text-primary); text-align: right; white-space: nowrap }
  .empty { padding: var(--lb-space-s4); background: var(--lb-card); border-radius: var(--lb-radius-md) }

  .bar-row + .bar-row { margin-top: var(--lb-space-s3) }
  .bar-top { display: flex; justify-content: space-between; gap: var(--lb-space-s4); margin-bottom: var(--lb-space-s1) }
  .bar-track { height: 6px; background: var(--lb-chrome); border-radius: 3px }
  .bar-fill { height: 6px; background: var(--lb-chart-bar); border-radius: 3px }
  .prose p { line-height: 1.6 }
  .prose p + p { margin-top: var(--lb-space-s3) }
  .table-row, .generic-row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--lb-space-s4) }
  .table-row + .table-row, .generic > * + * { margin-top: var(--lb-space-s2) }
  .generic-list { display: grid; gap: var(--lb-space-s1) }
  .generic-value { text-align: right; overflow-wrap: anywhere; white-space: pre-wrap }

  .owner-note { display: flex; align-items: baseline; gap: var(--lb-space-s2); padding: 0 var(--lb-space-s2); color: var(--lb-text-secondary) }
  .owner-note .glyph { position: relative; top: 1px; color: var(--lb-brand-text) }
  .comments { display: grid; gap: var(--lb-space-s2); padding: 0 var(--lb-space-s2) }
  .comment-list { display: grid; gap: var(--lb-space-s2) }
  .comment-list:empty { display: none }
  .comment-item { padding-left: var(--lb-space-s3); border-left: 2px solid var(--lb-hairline) }
  .comment-body { color: var(--lb-text-primary); white-space: pre-wrap; overflow-wrap: anywhere }
  .comment-toggle {
    justify-self: start; display: inline-flex; align-items: center; gap: 6px; min-height: 28px;
    padding: 0; color: var(--lb-text-tertiary); background: none; border: 0; font-family: inherit; cursor: pointer;
  }
  .comment-toggle:hover { color: var(--lb-brand-text) }
  .comment-form, .gate-form { display: grid; gap: var(--lb-space-s2) }
  .field {
    width: 100%; padding: 10px 12px; color: var(--lb-text-primary); background: var(--lb-card);
    border: 1px solid var(--lb-hairline); border-radius: var(--lb-radius-sm); font: inherit; font-size: 16px;
  }
  .field::placeholder { color: var(--lb-text-tertiary) }
  .field:focus { border-color: var(--lb-brand); outline: 1px solid var(--lb-brand) }
  textarea.field { min-height: 88px; resize: vertical }
  .btn {
    justify-self: start; min-height: 44px; padding: 10px 18px; color: var(--lb-on-brand); background: var(--lb-brand);
    border: 0; border-radius: var(--lb-radius-sm); font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: var(--lb-brand-hover) }
  .btn:disabled { opacity: .6; cursor: default }
  .form-note { min-height: 1.2em; color: var(--lb-danger) }

  .gate { display: grid; gap: var(--lb-space-s2); max-width: 420px; margin: 14vh auto 0 }
  .gate-form { margin-top: var(--lb-space-s4) }
  .gate-row { display: flex; gap: var(--lb-space-s2) }
  .gate-row .field { flex: 1; min-width: 0 }
  .gate-row .btn { flex: none }
  .field-label { color: var(--lb-text-secondary) }

  .report-foot {
    display: flex; flex-wrap: wrap; gap: var(--lb-space-s1) var(--lb-space-s2); margin-top: var(--lb-space-s12);
    padding-top: var(--lb-space-s4); border-top: 1px solid var(--lb-hairline);
  }
  .report-foot span + span::before { content: '·'; margin-right: var(--lb-space-s2) }
</style>
